<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            font-family: "Poppins", sans-serif;
            margin: 0px;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: #140439 !important;
            background: linear-gradient(to right, #000, #130F40);
            color: white;
        }

        .container {
            margin: 300px 0 0 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* animation: fadeIn 1.5s ease; */
        }

        .container p {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 52px;
        }

        .back {
            margin: 50px 0 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            border: none;
            font-weight: 900;
            font-size: 32px;
            padding: 12px;
            background-image: linear-gradient(109.6deg, rgb(160, 74, 163) 11.2%, rgba(87, 27, 226, 1) 96.7%);
            border-radius: 8px;
            cursor: pointer;
            transform: scale(0.99);
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            transform: scale(1.04);
        }


        .btn img {
            height: 32px;
            width: 32px;
        }

        .loader {
            position: absolute;
            top: 32%;
            left: 66%;
        }

        .z {
            position: absolute;
            font-size: 32px;
            opacity: 0;
        }

        .z-1 {
            animation: swayUpToRight 2s ease-out infinite;
        }

        .z-2 {
            animation: swayUpToRight 2s ease-out 0.5s infinite;
        }

        .z-3 {
            animation: swayUpToRight 2s ease-out 1s infinite;
        }

        .z-4 {
            animation: swayUpToRight 2s ease-out 1.5s infinite;
        }

        @keyframes swayUpToRight {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(80px, -100px) rotate(30deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container p:last-child {
            overflow: visible;
            border-right: none;
            white-space: normal;
            margin: 0 auto;
            letter-spacing: .15em;
            /* animation: none; */
        }

        @keyframes typing {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        @keyframes blink-caret {

            from,
            to {
                border-color: transparent
            }

            50% {
                border-color: orange;
            }
        }

        .back a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="loader">
        <div class="z z-1">Z</div>
        <div class="z z-2">Z</div>
        <div class="z z-3">Z</div>
        <div class="z z-4">Z</div>
    </div>

    <div class="container">
        <p>Under Construction</p>
        <p>Working On It ..... </p>
    </div>
    <div class="back">
        <a href="/index.html"><button class="btn"><img
                    src="https://img.icons8.com/?size=100&id=39789&format=png&color=000000" alt="">Back to
                Home</button></a>
    </div>
</body>

</html>
